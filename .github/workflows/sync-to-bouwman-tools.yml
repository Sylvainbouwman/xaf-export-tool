name: Sync naar bouwman-tools

on:
  push:
    branches: [master]
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Tests draaien
        run: node --test tests/xml-text.test.mjs

      - name: Kopieer naar bouwman-tools
        env:
          GH_TOKEN: ${{ secrets.BOUWMAN_TOOLS_PAT }}
        run: |
          gh auth setup-git
          git clone https://github.com/bouwman-tools/bouwman-tools.git _bouwman
          cp index.html _bouwman/xaf_export.html
          cd _bouwman
          git config user.email "s.bouwman@joinadministraties.nl"
          git config user.name "Sylvainbouwman"
          git add xaf_export.html
          git diff --staged --quiet || git commit -m "Sync vanuit xaf-export-tool"
          git pull origin master --rebase
          git push
